# 이미지 태그·digest 확인 기록: docs/decisions/ADR-001-stack.md
name: lecture-rag-search

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    volumes:
      - qdrant_data:/qdrant/storage
    # 이미지에 curl 이 없을 수 있어 bash /dev/tcp 로 /readyz 를 호출한다.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    # 포트는 공개하지 않는다. 개발 시 compose.override.yaml 에서 127.0.0.1 로만 공개.

  opensearch:
    build: ./infra/opensearch
    image: lecture-rag/opensearch-nori:2.19.7
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 2g
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    image: lecture-rag/api:local
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_data:/data
      - hf_cache:/home/app/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 4g
    restart: unless-stopped

  web:
    build: ./apps/web
    image: lecture-rag/web:local
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
  opensearch_data:
  api_data:
  hf_cache:
