name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Run Linux compose, integration and browser acceptance (downloads local embedding model)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install uv==0.11.6
      - name: Secret scan (index and history)
        run: |
          python scripts/check_secrets.py
          python scripts/check_secrets.py --history
      - name: Backend
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff check --config pyproject.toml ../../scripts
          uv run ruff format --check .
          uv run ruff format --check --config pyproject.toml ../../scripts
          uv run mypy app
          uv run pytest -m 'not integration'
      - name: Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Compose contract
        run: docker compose --env-file .env.example config --quiet
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - run: python -m pip install uv==0.11.6
      - name: Prepare isolated runner
        run: |
          mkdir -p .repro/artifacts
          python scripts/prepare_env.py
          sudo sysctl -w vm.max_map_count=262144
          uname -a > .repro/artifacts/environment.txt
          docker version >> .repro/artifacts/environment.txt
          docker compose version >> .repro/artifacts/environment.txt
      - name: Start four services
        run: |
          docker compose -f compose.yaml -f compose.override.example.yaml up --build -d --wait --wait-timeout 600
          docker compose ps > .repro/artifacts/compose-ps.txt
          python scripts/wait_ready.py | tee .repro/artifacts/ready.json
      - name: Engine integration
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run pytest -m integration -v --junitxml=../../.repro/artifacts/integration.xml
      - name: Browser acceptance with fake answers and local embeddings
        working-directory: apps/web
        env:
          E2E_BASE: http://127.0.0.1:3000
        run: |
          npm ci
          node e2e/browser_flow.mjs ../../data/samples/os_week3_process.pdf ../../.repro/artifacts/screenshots
      - name: Collect compose diagnostics
        if: always()
        run: |
          mkdir -p .repro/artifacts
          docker compose ps -a > .repro/artifacts/compose-ps-final.txt
          docker compose logs --no-color --tail 300 > .repro/artifacts/compose.log
          docker stats --no-stream > .repro/artifacts/docker-stats.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compose-${{ github.sha }}
          path: .repro/artifacts/
          retention-days: 14
      - name: Stop runner services
        if: always()
        run: docker compose -f compose.yaml -f compose.override.example.yaml down -v
